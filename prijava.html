<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">

    <title>Prijava</title>
</head>

<body>

    <header>
        <h1>Wordle</h1>
    </header>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#meni">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="meni">

                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a class="nav-link" href="home.html">Početna stranica</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="prijava.html">Prijava</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="registracija.html">Registracija</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="pravila.html">Pravila</a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <main class="container auth-container">

        <div class="auth-card">

            <h2>Prijava</h2>

            <p class="auth-description">
                Prijavite se u svoj Wordle račun i nastavite igrati!
            </p>

            <form id="prijava-forma">

                <div class="mb-3 text-start">
                    <label for="email" class="form-label">Email adresa</label>

                    <input type="email"
                           class="form-control"
                           id="email"
                           required>
                </div>

                <div class="mb-3 text-start">
                    <label for="zaporka" class="form-label">Zaporka</label>

                    <input type="password"
                           class="form-control"
                           id="zaporka"
                           required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Prijavi se
                </button>

                <p id="poruka" class="mt-3"></p>

            </form>

            <div class="auth-bottom">
                Nemate račun?
                <a href="registracija.html">Registrirajte se</a>
            </div>

        </div>

    </main>

    <footer>
        <p>Wordle projekt</p>
    </footer>

    <script src="auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
