<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle</title>
</head>
<body>
    <h1>Registracija</h1>
    <form>

        <label for="korisnicko_ime">Korisničko ime: </label>
        <input type="text" id="korisnicko_ime" placeholder="Unesite ime . . ." maxlength="25" required>
        <br>
        
        <label for="email">Email: </label>
        <input type="email" id="email" placeholder="Unesite email . . ." required>
        <br>

        <label for="zaporka">Zaporka: </label>
        <input type="text" id="zaporka" placeholder="Unesite zaporku . . ." maxlength="25" required>
        <br>

        <label for="zaporka_opet">Ponovite zaporku: </label>
        <input type="text" id="zaporka_opet" placeholder="Unesite zaporku opet . . ." maxlength="25" required>
        <br>

    </form>
</body>
</html>
